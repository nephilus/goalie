{{- include "goalie.validate" . -}}
{{- $networkPolicy := default (dict) .Values.networkPolicy -}}
{{- $ingressRules := default (list) (get $networkPolicy "ingress") -}}
{{- $egressRules := default (list) (get $networkPolicy "egress") -}}
{{ if get $networkPolicy "enabled" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "goalie.fullname" . }}
  labels:
    {{- include "goalie.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "goalie.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{ if $ingressRules }}
  ingress:
    {{ toYaml $ingressRules | nindent 4 }}
  {{ end }}
  {{ if $egressRules }}
  egress:
    {{ toYaml $egressRules | nindent 4 }}
  {{ end }}
{{ end }}
